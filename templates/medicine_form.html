{% extends 'base.html' %}
{% block content %}
<h2>{{ action }} Medicine Record</h2>

<div style="background: white; padding: 25px; border-radius: 5px; border: 1px solid #ddd; max-width: 600px;">
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Medicine Name</label>
            <input type="text" name="name" value="{{ medicine.name if medicine else '' }}" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Category</label>
            <select name="category_id" style="width: 100%; padding: 8px; box-sizing: border-box;">
                <option value="">-- Select Category --</option>
                {% for cat in categories %}
                    <option value="{{ cat.category_id }}" {% if medicine and medicine.category_id == cat.category_id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Batch Number</label>
            <input type="text" name="batch_number" value="{{ medicine.batch_number if medicine else '' }}" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Expiry Date</label>
            <input type="date" name="expiry_date" value="{{ medicine.expiry_date if medicine else '' }}" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Price</label>
            <input type="number" step="0.01" name="price" value="{{ medicine.price if medicine else '' }}" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Stock Quantity</label>
            <input type="number" name="quantity" value="{{ medicine.quantity if medicine else '' }}" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/admin/medicines" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
